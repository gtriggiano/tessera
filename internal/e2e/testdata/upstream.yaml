# The test upstream: every request on port 8081 gets 200 with the body
# "upstream", so that the test knows the request reached it. A request whose
# path starts with /reflect/ gets in its response the values of the headers
# x-client-asn, x-client-country, x-client-device and x-client-bot that
# reached the upstream, as x-upstream-client-asn, x-upstream-client-country,
# x-upstream-client-device and x-upstream-client-bot: the first value of
# each, and no header when the request had none.
static_resources:
  listeners:
    - name: upstream
      address:
        socket_address: { address: 0.0.0.0, port_value: 8081 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: upstream
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/reflect/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream\n" }
                          response_headers_to_add:
                            - header: { key: x-upstream-client-asn, value: "%REQ(x-client-asn)%" }
                            - header: { key: x-upstream-client-country, value: "%REQ(x-client-country)%" }
                            - header: { key: x-upstream-client-device, value: "%REQ(x-client-device)%" }
                            - header: { key: x-upstream-client-bot, value: "%REQ(x-client-bot)%" }
                        - match: { prefix: "/" }
                          direct_response:
                            status: 200
                            body: { inline_string: "upstream\n" }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
