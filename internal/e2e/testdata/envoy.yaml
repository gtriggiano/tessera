# The front proxy: every request on port 8080 asks tessera, at tessera:9001,
# before it goes to the test upstream, at upstream:8081.
static_resources:
  listeners:
    - name: front
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: front
                # As the documentation recommends: Envoy appends the address
                # of its peer to X-Forwarded-For, and normalizes the path
                # before tessera sees it.
                use_remote_address: true
                xff_num_trusted_hops: 1
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: UNESCAPE_AND_REDIRECT
                # The test compares the x-request-id that Envoy used with
                # the request_id of the decision event.
                always_set_request_id_in_response: true
                # As the documentation recommends with upstream headers: a
                # header such as x_client_country cannot stand for
                # x-client-country.
                common_http_protocol_options:
                  headers_with_underscores_action: REJECT_REQUEST
                route_config:
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      # A failed call to tessera answers 503, so that a 403
                      # can only be tessera's decision.
                      status_on_error: { code: ServiceUnavailable }
                      grpc_service:
                        envoy_grpc: { cluster_name: tessera }
                        timeout: 1s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: tessera
      type: STRICT_DNS
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: tessera
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: tessera, port_value: 9001 }
    - name: upstream
      type: STRICT_DNS
      load_assignment:
        cluster_name: upstream
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: upstream, port_value: 8081 }
