<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Regular Hexagonal Prism Shell Gradients -->
    <linearGradient id="prismStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E13EAF"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="prismFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E13EAF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Stratum 1 (Top — Envoy Request Ingress) -->
    <linearGradient id="stratumTopStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#C026D3"/>
    </linearGradient>
    <linearGradient id="stratumTopFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E13EAF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.28"/>
    </linearGradient>

    <!-- Stratum 2 (Middle — 3 Visible Parallel Analysis & Match Sub-Squares) -->
    <linearGradient id="stratumMidStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="stratumMidFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.32"/>
    </linearGradient>

    <!-- Stratum 3 (Bottom — 3/4 Cut-Out Policy Evaluation & Verdict Plane) -->
    <linearGradient id="stratumBotStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="stratumBotFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.44"/>
    </linearGradient>
  </defs>

  <!-- Outer True Regular Hexagon Prism Shell (R=104, center=128,128) -->
  <polygon points="128,24 218.07,76 218.07,180 128,232 37.93,180 37.93,76"
           fill="url(#prismFill)"
           stroke="url(#prismStroke)"
           stroke-width="4"
           stroke-linejoin="round"/>

  <!-- Subtle Inner Hexagonal Facet Rim (R=96) -->
  <polygon points="128,32 211.14,80 211.14,176 128,224 44.86,176 44.86,80"
           fill="none"
           stroke="#38BDF8"
           stroke-opacity="0.18"
           stroke-width="1.25"
           stroke-linejoin="round"/>

  <!-- Phase 1 (Top Stratum): Envoy Request Ingress Plane -->
  <polygon points="128,56 194,89 128,122 62,89"
           fill="url(#stratumTopFill)"
           stroke="url(#stratumTopStroke)"
           stroke-width="3"
           stroke-linejoin="round"/>

  <!-- Phase 2 (Middle Stratum): 3 Visible Parallel Analysis & Match Sub-Squares -->
  <g>
    <!-- Left Parallel Sub-Square -->
    <polygon points="92,113 122,128 92,143 62,128"
             fill="url(#stratumMidFill)"
             stroke="url(#stratumMidStroke)"
             stroke-width="2.75"
             stroke-linejoin="round"/>
    <!-- Right Parallel Sub-Square -->
    <polygon points="164,113 194,128 164,143 134,128"
             fill="url(#stratumMidFill)"
             stroke="url(#stratumMidStroke)"
             stroke-width="2.75"
             stroke-linejoin="round"/>
    <!-- Bottom-Center Parallel Sub-Square -->
    <polygon points="128,131 158,146 128,161 98,146"
             fill="url(#stratumMidFill)"
             stroke="url(#stratumMidStroke)"
             stroke-width="2.75"
             stroke-linejoin="round"/>
  </g>

  <!-- Phase 3 (Bottom Stratum): 3/4 Cut-Out Policy Evaluation & Verdict Plane -->
  <polygon points="92,152 128,170 164,152 194,167 128,200 62,167"
           fill="url(#stratumBotFill)"
           stroke="url(#stratumBotStroke)"
           stroke-width="3"
           stroke-linejoin="round"/>
</svg>
