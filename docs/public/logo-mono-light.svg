           stroke="#F8FAFC" stroke-width="3.5" stroke-linejoin="round"/>
  <polygon points="128,131 158,146 128,161 98,146"
           fill="#F8FAFC" fill-opacity="0.18"
           stroke="#F8FAFC" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Phase 3 (Bottom Stratum — 3/4 Cut-Out Plane) -->
  <polygon points="92,152 128,170 164,152 194,167 128,200 62,167"
