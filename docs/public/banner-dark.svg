9 56.75 L253.71 62.00 L239.65 62.00 Z M253.05 54.45 L258.37 49.35 L258.37 46.90 L244.46 46.90 L242.46 48.90 L242.46 52.60 L244.31 54.45 Z"/>

    <!-- Tagline (two lines, as on the social card) -->
    <text x="2" y="108" fill="#E2E8F0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="26" font-weight="500">External authorization for Envoy, rule by rule.</text>
    <text x="2" y="142" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">Fast, explainable, fail-closed.</text>
  </g>
</svg>
