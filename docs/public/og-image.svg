<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="markGlow" cx="23%" cy="50%" r="44%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    
    <pattern id="isoGrid" width="56" height="32.33" patternUnits="userSpaceOnUse">
      <path d="M 0 16.165 L 28 0 L 56 16.165 L 28 32.33 Z" fill="none" stroke="#38BDF8" stroke-opacity="0.055" stroke-width="0.9"/>
    </pattern>
    <radialGradient id="gridFade" cx="50%" cy="50%" r="58%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="68%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
    
    <linearGradient id="prismStroke" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E13EAF"/><stop offset="50%" stop-color="#06B6D4"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <linearGradient id="prismFill" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E13EAF" stop-opacity="0.08"/><stop offset="50%" stop-color="#06B6D4" stop-opacity="0.10"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="topS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#C026D3"/></linearGradient>
    <linearGradient id="topF" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#E13EAF" stop-opacity="0.42"/><stop offset="100%" stop-color="#9333EA" stop-opacity="0.28"/></linearGradient>
    <linearGradient id="midS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#A855F7"/><stop offset="45%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#06B6D4"/></linearGradient>
    <linearGradient id="midF" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.38"/><stop offset="100%" stop-color="#06B6D4" stop-opacity="0.32"/></linearGradient>
    <linearGradient id="botS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0EA5E9"/><stop offset="100%" stop-color="#10B981"/></linearGradient>
    <linearGradient id="botF" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.34"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.44"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#isoGrid)" mask="url(#gridMask)"/>
  <rect width="1200" height="630" fill="url(#markGlow)"/>

  <!-- Top & Bottom Accent Spectrum Rule -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#prismStroke)"/>
  <rect x="0" y="625" width="1200" height="5" fill="url(#prismStroke)" opacity="0.5"/>

  <!-- Left: Primary Isometric Logic Prism Mark (1.42x) -->
  <g transform="translate(225, 315) scale(1.42) translate(-128, -128)">
    
    <polygon points="128,24 218.07,76 218.07,180 128,232 37.93,180 37.93,76" fill="url(#prismFill)" stroke="url(#prismStroke)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="128,32 211.14,80 211.14,176 128,224 44.86,176 44.86,80" fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1.25" stroke-linejoin="round"/>
    <polygon points="128,56 194,89 128,122 62,89" fill="url(#topF)" stroke="url(#topS)" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="92,113 122,128 92,143 62,128" fill="url(#midF)" stroke="url(#midS)" stroke-width="2.75" stroke-linejoin="round"/>
    <polygon points="164,113 194,128 164,143 134,128" fill="url(#midF)" stroke="url(#midS)" stroke-width="2.75" stroke-linejoin="round"/>
    <polygon points="128,131 158,146 128,161 98,146" fill="url(#midF)" stroke="url(#midS)" stroke-width="2.75" stroke-linejoin="round"/>
    <polygon points="92,152 128,170 164,152 194,167 128,200 62,167" fill="url(#botF)" stroke="url(#botS)" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- Right: Swiss-Grid Aligned Typography -->
  <g transform="translate(430, 210)">
    <!-- Cloud Native Category Pill -->
    <rect x="0" y="0" width="222" height="32" rx="16" fill="#1E293B" fill-opacity="0.72" stroke="#334155" stroke-width="1.25"/>
    <circle cx="18" cy="16" r="4.5" fill="#E13EAF"/>
    <text x="32" y="20.5" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="0.8">ENVOY EXT_AUTHZ • GRPC</text>

