2.17 L304.40 81.24 L304.40 114.00 L294.41 114.00 L294.41 108.04 L288.19 114.00 L272.23 114.00 Z M287.44 105.43 L293.48 99.64 L293.48 96.86 L277.69 96.86 L275.42 99.13 L275.42 103.33 L277.52 105.43 Z"/>

    <!-- Tagline (two lines, for readability at social-card sizes) -->
    <text x="2" y="168" fill="#E2E8F0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="26" font-weight="500">External authorization for Envoy, rule by rule.</text>
    <text x="2" y="204" fill="#94A3B8" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Fast, explainable, fail-closed.</text>
  </g>
